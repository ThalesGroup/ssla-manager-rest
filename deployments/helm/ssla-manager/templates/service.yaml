apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ssla-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssla-manager.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ssla-manager.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
