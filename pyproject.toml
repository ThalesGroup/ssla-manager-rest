[project]
name = "sslamanagerrest"
version = "0.2.1"
description = ""
authors = [
    {name = "Louis Cailliot",email = "louis.cailliot@thalesgroup.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "python-multipart (>=0.0.30,<0.0.32)",
    "sslamanager @ git+https://github.com/ThalesGroup/ssla-manager.git@v0.1.5",

]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true
[dependency-groups]
dev = [
    "uv-build>=0.7.14",
]

[project.scripts]
sslamanagerrest = 'sslamanagerrest.__main__:main'


